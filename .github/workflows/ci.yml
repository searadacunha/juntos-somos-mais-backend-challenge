name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Offline: the two sources are replaced by an httpx mock transport.
      - run: pytest --cov

  image:
    name: Docker image against the real sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker build -t customers-api .

      - name: Start the container
        run: docker run -d --name api -p 8080:8080 --health-interval=2s customers-api

      - name: Wait until the image's health check reports healthy (polled every 2 s here)
        run: |
          for attempt in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "health status: $status"
          exit 1

      - name: Official validator, unchanged
        run: |
          ./validate.sh | tee validate.out
          grep -qx "Response body is valid." validate.out

      # validate.sh greps for "2000" anywhere in the body and always exits 0,
      # so the total and the two paths are also checked strictly.
      - name: Exact total on both paths, identical answers
        run: |
          for path in /users /api/v1/users; do
            total=$(curl -fsS "http://localhost:8080${path}?pageNumber=1&pageSize=10" | jq '.totalCount')
            echo "${path}: totalCount=${total}"
            test "$total" = "2000"
          done
          readme_path=$(curl -fsS 'http://localhost:8080/users?pageSize=100&pageNumber=20' | jq -cS .)
          validator_path=$(curl -fsS 'http://localhost:8080/api/v1/users?pageSize=100&pageNumber=20' | jq -cS .)
          test "$(echo "$readme_path" | jq '.users | length')" = "100"
          test "$readme_path" = "$validator_path"
          curl -fsS http://localhost:8080/health

      - name: Every customer against a second implementation of the rules
        run: python3 tools/verify_live.py http://localhost:8080

      - name: The process is not root
        run: test "$(docker exec api id -u)" != "0"

      # The CSV is loaded first. Making the JSON unreachable checks the case where half
      # of the data is already in memory: the process must still exit, with code 3.
      - name: An unreachable source stops the container, even once the other one is loaded
        run: |
          for source in CSV JSON; do
            code=0
            timeout 120 docker run --rm -e "${source}_URL=http://127.0.0.1:9/missing" customers-api \
              > "unreachable-${source}.log" 2>&1 || code=$?
            cat "unreachable-${source}.log"
            echo "exit code with ${source} unreachable: ${code}"
            test "$code" = "3"
          done
          grep -q "startup aborted: csv source: download failed with ConnectError" unreachable-CSV.log
          grep -q "source=csv records=1000 accepted=1000 rejected=0" unreachable-JSON.log
          grep -q "startup aborted: json source: download failed with ConnectError" unreachable-JSON.log

      - name: Container logs
        if: always()
        run: docker logs api
